<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder - Projects</title>
  <link rel="stylesheet" href="resume.css">

  <!-- HOVER EFFECTS -->
  <style>
    .action-btn {
      transition: transform 0.25s ease, font-size 0.25s ease;
      cursor: pointer;
    }
    .action-btn:hover {
      transform: scale(1.08);
      font-size: 1.05em;
    }
    .add-btn {
      background-color: #ffe28a;
      border: 3px solid black;
      padding: 10px 20px;
      font-size: 16px;
    }
    .delete-btn {
      background-color: #ff8a8a;
      border: 2px solid black;
      padding: 6px 12px;
    }
    .project-box {
      border: 3px solid black;
      padding: 20px;
      margin: 20px auto;
      width: 70%;
      background-color: #fff;
    }
  </style>
</head>

<body>

<!-- TITLE -->
<div class="div1">
  <h1 style="font-size: 50px;
             text-decoration-line: underline overline;
             text-decoration-thickness:4px;
             text-decoration-color: black;">
    PROJECTS
  </h1>
</div>

<br>

<form id="projects-form">

<!-- PROJECT CONTAINER -->
<div id="projects-container">

  <!-- PROJECT 1 -->
  <div class="project-box">

    <label><b>Project Name</b></label><br>
    <input type="text" name="projectName[]" placeholder="Project Title"
           style="width:300px;"><br><br>

    <label>Year (Optional)</label><br>
    <input type="number" name="projectYear[]" placeholder="e.g. 2024"
           style="width:150px;"><br><br>

    <label>Tech Stack</label><br>
    <input type="text" name="projectTech[]" placeholder="Python, React, MongoDB"
           style="width:400px;"><br><br>

    <label>Project Description</label>
    <ul>
      <li><input type="text" name="projectDesc1[]" placeholder="Point 1" style="width:500px;"></li><br>
      <li><input type="text" name="projectDesc2[]" placeholder="Point 2" style="width:500px;"></li><br>
      <li><input type="text" name="projectDesc3[]" placeholder="Point 3" style="width:500px;"></li>
    </ul>

    <br>
    <button type="button"
            class="delete-btn action-btn"
            onclick="deleteProject(this)">
      Delete Project
    </button>

  </div>

</div>

<br>

<!-- ADD PROJECT -->
<center>
  <button type="button"
          class="add-btn action-btn"
          onclick="addProject()">
    + ADD PROJECT
  </button>
</center>

<br><br>

<!-- NAVIGATION -->
<center>
  <div class="hello"
       style="text-align: center;
              border: 3px solid black;
              width: 45%;
              padding: 40px;
              background-color: rgb(243, 143, 106);">

    <input type="button"
           value="← BACK"
           onclick="goBack()"
           class="action-btn"
           style="border: 3px solid black;
                  width: 120px;
                  padding: 15px;
                  background-color: #b0c4de;
                  font-family: 'Times New Roman', Times, serif;
                  font-size: large;">

    &nbsp;&nbsp;&nbsp;

    <input type="reset"
           value="CLEAR ALL"
           class="action-btn"
           style="border: 3px solid black;
                  width: 130px;
                  padding: 15px;
                  background-color: rgb(8, 232, 79);
                  font-family: 'Times New Roman', Times, serif;
                  font-size: large;">

    &nbsp;&nbsp;&nbsp;

    <input type="button"
           value="NEXT"
           onclick="goNext()"
           class="action-btn"
           style="border: 3px solid black;
                  width: 140px;
                  padding: 15px;
                  background-color: rgba(237, 43, 43, 0.797);
                  font-family: 'Times New Roman', Times, serif;
                  font-size: large;">
  </div>
</center>

</form>

<br><hr>

<!-- JAVASCRIPT -->
<script>
function addProject() {
  const container = document.getElementById("projects-container");

  const div = document.createElement("div");
  div.className = "project-box";

  div.innerHTML = `
    <label><b>Project Name</b></label><br>
    <input type="text" name="projectName[]" placeholder="Project Title"
           style="width:300px;"><br><br>

    <label>Year (Optional)</label><br>
    <input type="number" name="projectYear[]" placeholder="e.g. 2024"
           style="width:150px;"><br><br>

    <label>Tech Stack</label><br>
    <input type="text" name="projectTech[]" placeholder="Python, React, MongoDB"
           style="width:400px;"><br><br>

    <label>Project Description</label>
    <ul>
      <li><input type="text" name="projectDesc1[]" placeholder="Point 1" style="width:500px;"></li><br>
      <li><input type="text" name="projectDesc2[]" placeholder="Point 2" style="width:500px;"></li><br>
      <li><input type="text" name="projectDesc3[]" placeholder="Point 3" style="width:500px;"></li>
    </ul>

    <br>
    <button type="button"
            class="delete-btn action-btn"
            onclick="deleteProject(this)">
      Delete Project
    </button>
  `;

  container.appendChild(div);
}

function deleteProject(button) {
  const container = document.getElementById("projects-container");
  if (container.children.length > 1) {
    button.closest(".project-box").remove();
  } else {
    alert("At least one project is required.");
  }
}

function goBack() {
  window.location.href = "skills.html";
}

function goNext() {
  window.location.href = "certifications.html";
}
</script>

</body>
</html>
